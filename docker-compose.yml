name: wabot

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wabot
      POSTGRES_PASSWORD: wabot
      POSTGRES_DB: wabot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wabot -d wabot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://wabot:wabot@db:5432/wabot
      MEDIA_DIR: /app/data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/data/media
      - ./backend/config:/app/config
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ia-local"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  pgdata:
  media:
  ollama:
